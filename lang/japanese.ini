subs_vtt = VTT (オリジナル)
subs_srt = SRT (変換、互換性が高い)

exclude_label = シリーズ解析時に除外するキーワード (カンマ,区切り):
exclude_placeholder = 例: 予告, ダイジェスト, 解説放送版
embed_thumb_check = 動画ファイルにサムネイルを含める (エクスプローラー・プレイヤーのプレビュー)
embed_thumb_tooltip = yt-dlpに--embed-thumbnailオプションを渡し、カバー画像をmp4の中に入れます。
    アプリ内リストのサムネイルと違い、エクスプローラーや外部プレイヤーでもプレビューが見えます。
    含めるのに失敗しても動画のダウンロード自体はそのまま完了します。
ignore_ssl_check = SSL証明書の検証をスキップ (接続エラー時のみ使用)
ignore_ssl_tooltip = チェックするとyt-dlpに--no-check-certificateオプションを渡します。
    中間者攻撃にさらされる可能性があるため、証明書エラーでダウンロードが失敗するときだけ使ってください。

