quality_label = ダウンロード画質の選択:
quality_best = 最高画質 (既定値)
quality_1080p = 1080p
quality_720p = 720p
codec_label = 優先コーデック (再エンコード):
codec_original = 元のまま (再エンコードなし、既定値)
codec_avc = AVC/H.264 (最高の互換性)
codec_hevc = HEVC/H.265 (高効率)
codec_tooltip = 取得した動画がここで選んだコーデックでなければ、そのコーデックで作り直します。
    このとき音声もAACで一緒に作り直します — OpusやVorbisのまま残ると
    編集ツールでオーディオトラックがまったく認識されないためです。
    音声ビットレートは元に合わせて決まり、元が既にAACならそのままにします。

    品質は決まった値を使います(AVCはCRF 20、HEVCはCRF 23、いずれもpreset slow)。
    作り直すのに時間がかかり画質も元より少し落ちるので、
    特に必要でなければ「元のまま」が最良です。
encoder_label = コーデック変換のアクセラレーション (GPUエンコード):
encoder_cpu = CPU (既定値、互換性)
encoder_nvidia = NVIDIA (NVENC)
encoder_tooltip = 作り直す作業をグラフィックカードに任せます。CPUよりずっと高速です。
    その代わり同じ品質指数での圧縮効率が少し落ち、ファイルが大きくなります。
    NVIDIAのグラフィックカードがないと変換に失敗するのでCPUのままにしてください。

subs_download = 字幕ダウンロードを有効にする
