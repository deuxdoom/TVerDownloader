    「自動検出」はWindowsの表示言語に従い、
    対応していない言語なら英語になります。
    変更はアプリを再起動してから反映されます。
    翻訳ファイルは _internal フォルダ内の lang フォルダにあり、自分で編集できます。
folder_label = ダウンロードフォルダ:
browse = 参照...
