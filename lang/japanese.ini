fragments_label = 1本の動画で同時に取得するフラグメント数:
fragments_tooltip = TVerの動画は数百個の小さなフラグメントに分かれています。
    1個ずつ順に取得すると回線を使い切れず遅くなります。
    この値を上げると複数のフラグメントをまとめて取得し、その分速くなります。

    上の同時ダウンロード数と掛け算になります — 両方を大きく上げると
    接続が増えすぎてTVerにブロックされることがあります。
    1にするとこの機能を使いません。
close_label = 閉じるボタン(X)を押したとき:
close_tray = トレイに移動
close_exit = アプリを終了
clipboard_label = クリップボード:
clipboard_check = TVerのURLをコピーしたら入力欄に自動で入れる
clipboard_tooltip = TVerのURLをコピーすると上の入力欄に自動で入ります。
    ダウンロードが勝手に始まることはなく、入力欄に既に文字があれば触りません。
    TVerのURL以外のクリップボード内容はどこにも送りません。
    オフにするとクリップボードを一切監視しません。
favorites_label = お気に入り:
fav_autocheck_check = アプリ起動時に新着エピソードを確認する
fav_autocheck_tooltip = 起動して少し経ってから、お気に入りのシリーズをすべて確認します。
    TVerは日本国内限定のため、VPNをオンにする前に確認が走ると全部失敗で終わります。
    Windows起動と同時に立ち上がるようにしているならオフのほうが無難です。
    オフでもお気に入りタブの「すべて更新」でいつでも自分で確認できます。
update_label = アップデート:
auto_update_check = アプリ起動時に新しいバージョンを確認する
auto_update_tooltip = 起動後に新しいバージョンが出ているか確認し、あればお知らせします。
    入れるかどうかはその時に選べばよく、勝手にダウンロードされることはありません。
    「今すぐアップデート」を押すと新しいバージョンを取得してその場で入れ替えます。
    このとき設定・履歴・お気に入りとbinフォルダはそのまま残します。
    オフにすると確認自体を行いません。

shortcut_guide = 入力欄をクリックしてから押したいキーを押すと変わります。空欄にするとそのショートカットは使いません。
shortcut_conflict_header = 同じ組み合わせを共有しています。このままではどちらも動作しません。
