subs_embed = รวมคำบรรยายเข้าไปในไฟล์วิดีโอ (ฝัง)
subs_format_group = รูปแบบเมื่อบันทึกเป็นไฟล์แยก
subs_vtt = VTT (ต้นฉบับ)
subs_srt = SRT (แปลงแล้ว, เข้ากันได้ดีกว่า)

exclude_label = คำที่ต้องการยกเว้นตอนวิเคราะห์ซีรีส์ (คั่นด้วยจุลภาค):
exclude_placeholder = เช่น 予告, ダイジェスト, 解説放送版
embed_thumb_check = ฝังภาพย่อลงในไฟล์วิดีโอ (ตัวอย่างใน Explorer และโปรแกรมเล่น)
embed_thumb_tooltip = ส่ง --embed-thumbnail ให้ yt-dlp เพื่อเก็บภาพปกไว้ในไฟล์ mp4
    ต่างจากภาพย่อในรายการของโปรแกรมนี้ ตรงที่จะเห็นใน Explorer และโปรแกรมเล่นภายนอกด้วย
    ถึงการฝังจะล้มเหลว การดาวน์โหลดวิดีโอเองก็ยังเสร็จสมบูรณ์
ignore_ssl_check = ข้ามการตรวจสอบใบรับรอง SSL (ใช้เฉพาะเมื่อเชื่อมต่อผิดพลาด)
ignore_ssl_tooltip = เมื่อติ๊กไว้ จะส่ง --no-check-certificate ให้ yt-dlp
    การทำแบบนี้เสี่ยงต่อการถูกดักกลางทาง จึงควรใช้เฉพาะเมื่อใบรับรองผิดพลาดจนดาวน์โหลดไม่ได้

cache_size_label = ขนาดแคชภาพย่อในตอนนี้:
