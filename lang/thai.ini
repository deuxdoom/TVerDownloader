    เพื่อความเสถียรของการเชื่อมต่อ ผลคูณของสองค่านี้ต้องไม่เกิน {maximum}

    การเชื่อมต่อมากเกินไปจะทำให้ TVer บล็อกคุณ และเมื่อถูกบล็อกแล้ว
    การดาวน์โหลดจะใช้ไม่ได้ไปอีกพักหนึ่งแม้จะลดค่าลงแล้วก็ตาม

    กรุณาลดค่าใดค่าหนึ่งแล้วบันทึกอีกครั้ง
