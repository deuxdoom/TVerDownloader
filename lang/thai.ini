    การดึงทีละชิ้นจะใช้แบนด์วิดท์ไม่เต็มที่และช้า
    การเพิ่มค่านี้จะดึงหลายชิ้นพร้อมกัน จึงเร็วขึ้นตามนั้น

    ค่านี้จะคูณกับจำนวนดาวน์โหลดพร้อมกันด้านบน หากเพิ่มทั้งสองค่า
    มากเกินไป จะเปิดการเชื่อมต่อมากจน TVer อาจบล็อกคุณ
    ตั้งเป็น 1 เพื่อปิดฟังก์ชันนี้
close_label = เมื่อกดปุ่มปิด (X):
close_tray = ย่อลงถาดระบบ
close_exit = ออกจากโปรแกรม
clipboard_label = คลิปบอร์ด:
clipboard_check = ใส่ลงช่องกรอกอัตโนมัติเมื่อคัดลอก URL ของ TVer
clipboard_tooltip = เมื่อคัดลอก URL ของ TVer จะถูกใส่ลงในช่องกรอกด้านบนให้เอง
    การดาวน์โหลดจะไม่เริ่มเอง และถ้าช่องกรอกมีข้อความอยู่แล้วก็จะไม่ไปแตะต้อง
    เนื้อหาในคลิปบอร์ดที่ไม่ใช่ URL ของ TVer จะไม่ถูกส่งไปที่ใดทั้งสิ้น
    เมื่อปิดไว้ จะไม่เฝ้าดูคลิปบอร์ดเลย
favorites_label = รายการโปรด:
fav_autocheck_check = ตรวจหาตอนใหม่ตอนเปิดโปรแกรม
fav_autocheck_tooltip = หลังเปิดโปรแกรมไม่นาน จะตรวจสอบซีรีส์ทั้งหมดในรายการโปรด
    TVer จำกัดเฉพาะญี่ปุ่น การตรวจสอบก่อนที่ VPN จะเชื่อมต่อจึงล้มเหลวทั้งหมด
    ถ้าตั้งให้โปรแกรมเริ่มพร้อม Windows ควรปิดตัวเลือกนี้ไว้
    แม้ปิดไว้ ก็ยังกด "รีเฟรชทั้งหมด" ในแท็บรายการโปรดได้ทุกเมื่อ
update_label = การอัปเดต:
auto_update_check = ตรวจหาเวอร์ชันใหม่ตอนเปิดโปรแกรม
auto_update_tooltip = ตรวจว่ามีเวอร์ชันใหม่หรือไม่หลังเปิดโปรแกรม และแจ้งให้ทราบถ้ามี
    จะติดตั้งหรือไม่ค่อยตัดสินใจตอนนั้น ไม่มีการดาวน์โหลดเองโดยพลการ
    เมื่อกด "อัปเดตเลย" จะดึงเวอร์ชันใหม่มาแล้วแทนที่ทันที
    การตั้งค่า ประวัติ รายการโปรด และโฟลเดอร์ bin จะไม่ถูกแตะต้อง
    เมื่อปิดไว้ จะไม่ตรวจสอบเลย

shortcut_guide = คลิกที่ช่องแล้วกดปุ่มที่ต้องการ ปล่อยว่างไว้เพื่อปิดใช้ปุ่มลัดนั้น
shortcut_conflict_header = การกระทำเหล่านี้ใช้ปุ่มผสมชุดเดียวกัน ถ้าปล่อยไว้แบบนี้ กดแล้วจะไม่ทำงานสักอย่าง
shortcut_note = ปุ่มผสมที่ไม่มี Ctrl หรือ Alt จะไม่ทำงานขณะที่กำลังพิมพ์ข้อความ
shortcut_reset = คืนค่าเริ่มต้น
shortcut_conflict_title = ปุ่มลัดชนกัน
shortcut_conflict_body = มีสองการกระทำที่ใช้ปุ่มผสมชุดเดียวกัน
    กรุณาแก้ที่ซ้ำกันแล้วบันทึกอีกครั้ง

filename_guide = เลือกส่วนประกอบของชื่อไฟล์และลำดับ (ลากรายการเพื่อจัดลำดับใหม่):
part_series = ชื่อซีรีส์
part_upload_date = วันที่ออกอากาศ
part_episode_number = หมายเลขตอน
part_episode = ชื่อเรื่อง
part_id = ID เฉพาะ
filename_preview_label = ตัวอย่างชื่อไฟล์:
filename_preview_empty = (ไม่ได้เลือกอะไรไว้)

quality_label = คุณภาพการดาวน์โหลด:
quality_best = คุณภาพสูงสุด (ค่าเริ่มต้น)
quality_1080p = 1080p
quality_720p = 720p
codec_label = โคเดกที่ต้องการ (เข้ารหัสใหม่):
codec_original = คงต้นฉบับไว้ (ไม่เข้ารหัสใหม่, ค่าเริ่มต้น)
codec_avc = AVC/H.264 (เข้ากันได้ดีที่สุด)
codec_hevc = HEVC/H.265 (ประสิทธิภาพสูง)
codec_tooltip = ถ้าวิดีโอที่ดาวน์โหลดมาไม่ใช่โคเดกที่เลือกไว้ตรงนี้ จะถูกเข้ารหัสใหม่เป็นโคเดกนั้น
    เสียงจะถูกเข้ารหัสใหม่เป็น AAC ไปพร้อมกันด้วย เพราะถ้าปล่อยเป็น Opus หรือ Vorbis
    โปรแกรมตัดต่อจะมองไม่เห็นแทร็กเสียงเลย
    บิตเรตของเสียงจะอิงตามต้นฉบับ และถ้าเสียงเป็น AAC อยู่แล้วก็จะคัดลอกตามเดิม

    คุณภาพใช้ค่าตายตัว (AVC ใช้ CRF 20, HEVC ใช้ CRF 23, ทั้งคู่ใช้ preset slow)
    การเข้ารหัสใหม่ใช้เวลาและผลลัพธ์จะด้อยกว่าต้นฉบับเล็กน้อย
    ดังนั้น "คงต้นฉบับไว้" จึงดีที่สุด ยกเว้นว่าคุณต้องการอย่างอื่นจริง ๆ
encoder_label = การเร่งความเร็วการแปลงโคเดก (เข้ารหัสด้วย GPU):
encoder_cpu = CPU (ค่าเริ่มต้น, ความเข้ากันได้)
encoder_nvidia = NVIDIA (NVENC)
encoder_tooltip = ยกงานเข้ารหัสใหม่ให้การ์ดจอทำ เร็วกว่า CPU มาก
    แลกกับประสิทธิภาพการบีบอัดที่ระดับคุณภาพเดียวกันลดลงเล็กน้อย ไฟล์จึงใหญ่ขึ้น
    ถ้าไม่มีการ์ดจอ NVIDIA การแปลงจะล้มเหลว จึงควรปล่อยไว้ที่ CPU

