language_label = 语言:
language_system = 自动检测(系统语言)
language_tooltip = 用这个语言显示程序的所有文字。
    "自动检测"会跟随 Windows 的显示语言,
    不支持的语言会显示为英语。
    修改后需要重新启动程序才会生效。
    翻译文件在 _internal 文件夹里的 lang 文件夹中,可以自行编辑。
folder_label = 下载文件夹:
browse = 浏览...
folder_dialog_title = 选择下载文件夹
parallel_label = 最大同时下载数:
fragments_label = 单个视频并行下载的分片数:
fragments_tooltip = TVer 的视频被切成数百个小分片。
    一个一个按顺序取会用不满带宽,所以很慢。
    调高这个值会同时取多个分片,速度也就相应提升。

    这个值会和上面的同时下载数相乘 —— 两边都调得太高
    会打开过多连接,TVer 可能会封锁您。
    设为 1 表示关闭这个功能。
close_label = 点击关闭按钮(X)时:
close_tray = 最小化到托盘
close_exit = 退出程序
clipboard_label = 剪贴板:
clipboard_check = 复制 TVer 网址时自动填入输入框
clipboard_tooltip = 复制 TVer 网址时,会自动填入上方的输入框。
    下载不会自动开始,输入框里已经有文字时也不会覆盖。
    不是 TVer 网址的剪贴板内容绝不会发送到任何地方。
    关闭时完全不监视剪贴板。
favorites_label = 收藏夹:
fav_autocheck_check = 启动时检查新集数
fav_autocheck_tooltip = 启动后不久会检查收藏夹里的所有剧集。
    TVer 有日本地区限制,在 VPN 连上之前检查会全部失败。
    如果设置了开机自动启动,建议保持关闭。
    即使关闭,也可以随时用收藏夹标签页的"全部刷新"手动检查。
update_label = 更新:
auto_update_check = 启动时检查新版本
auto_update_tooltip = 启动后会检查是否有新版本,有的话会通知您。
    要不要安装由您当时决定,不会自动下载。
    点击"立即更新"会取得新版本并当场替换。
    您的设置、记录、收藏夹和 bin 文件夹都不会被改动。
    关闭时完全不做检查。

shortcut_guide = 点击输入框后按下想用的按键。留空表示停用该快捷键。
shortcut_conflict_header = 这些操作共用同一个组合键。保持这样的话按下去哪个都不会执行。
shortcut_note = 不含 Ctrl 或 Alt 的组合在输入文字时不会触发。
shortcut_reset = 恢复默认值
shortcut_conflict_title = 快捷键冲突
shortcut_conflict_body = 有两个操作共用同一个组合键。
    请解决重复后再保存一次。

filename_guide = 选择文件名的组成部分和顺序(拖动项目可以调整顺序):
part_series = 剧集名
part_upload_date = 播出日期
part_episode_number = 集数
part_episode = 标题
part_id = 唯一 ID
filename_preview_label = 文件名预览:
filename_preview_empty = (没有选中任何项目)

quality_label = 下载画质:
quality_best = 最高画质(默认)
quality_1080p = 1080p
quality_720p = 720p
codec_label = 首选编码(重新编码):
codec_original = 保留原始(不重新编码,默认)
codec_avc = AVC/H.264(兼容性最好)
codec_hevc = HEVC/H.265(效率更高)
codec_tooltip = 下载的视频如果不是这里选的编码,就会重新编码成它。
    音频也会同时重新编码成 AAC —— 如果保留 Opus 或 Vorbis,
    剪辑软件会完全识别不到音轨。
    音频码率跟随源文件,本来就是 AAC 的会原样复制。

    质量使用固定值(AVC 为 CRF 20,HEVC 为 CRF 23,都是 preset slow)。
    重新编码需要时间,画质也会比源文件略差,
    所以除非确有需要,"保留原始"是最好的选择。
encoder_label = 编码转换加速(GPU 编码):
encoder_cpu = CPU(默认,兼容性)
encoder_nvidia = NVIDIA(NVENC)
encoder_tooltip = 把重新编码交给显卡处理。比 CPU 快得多。
    代价是相同质量等级下压缩效率略低,文件会变大。
    没有 NVIDIA 显卡时转换会失败,所以请保持 CPU。

subs_download = 启用字幕下载
subs_embed = 把字幕合并进视频文件(嵌入)
subs_format_group = 单独保存时的格式
subs_vtt = VTT(原始)
subs_srt = SRT(转换,兼容性更好)

exclude_label = 解析剧集时要排除的关键词(用逗号分隔):
exclude_placeholder = 例:予告, ダイジェスト, 解説放送版
embed_thumb_check = 在视频文件中嵌入缩略图(资源管理器/播放器预览)
embed_thumb_tooltip = 向 yt-dlp 传递 --embed-thumbnail,把封面图存进 mp4 里。
    和本程序列表中的缩略图不同,资源管理器和外部播放器里也能看到。
    即使嵌入失败,视频下载本身仍会正常完成。
ignore_ssl_check = 跳过 SSL 证书验证(仅在连接出错时使用)
ignore_ssl_tooltip = 勾选后会向 yt-dlp 传递 --no-check-certificate。
    这会让您暴露在中间人攻击下,所以只在证书错误导致下载失败时使用。

cache_size_label = 当前缩略图缓存大小:
cache_calculating = 正在计算...
cache_clear_button = 清除缩略图缓存
cache_confirm_title = 清除缓存
cache_confirm_body = 要删除所有已缓存的缩略图吗?
cache_done_title = 完成
cache_done_body = 已删除 {count} 个缩略图缓存。
cache_error_title = 错误
cache_error_body = 清除缓存时出错:
    {error}

connection_title = 连接数过多
connection_body = 同时下载 {parallel} 个 x 分片 {fragments} 个 = 一次 {total} 个连接。
    为了连接稳定,两个值相乘不能超过 {maximum}。

    连接过多会被 TVer 封锁,一旦被封,即使再把数值调低
    也会有一段时间无法下载。

    请减少其中一个后重新保存。
save_failed_title = 无法保存设置
save_failed_body = 设置文件写入失败。
    请确认您对程序文件夹有写入权限。
    这次修改只在本次运行中有效,下次启动就会消失。

restart_title = 语言已更改
restart_body = 新语言只有在程序重新启动后才会显示。

    现在就重启吗?
restart_yes = 立即重启
restart_no = 稍后
restart_failed_title = 无法重新启动
restart_failed_body = 无法重新启动程序,将保持当前状态继续运行。

    新语言会在下次启动程序时生效。

[about]
title = 关于
intro = TVer Downloader 是一款把 TVer 内容下载到本地供个人使用的 Windows 应用。
    TVer 有仅限日本的地区限制,因此必须使用日本的 VPN。
features_title = 主要功能
features = 多语言支持
    单集/剧集网址解析与批量添加
    拖放网址、剪贴板自动识别、快捷键
    重启后仍保留的队列,可调的同时下载数与分片并行数
    画质选择、编码重新编码(GPU 加速)、字幕合并
    收藏剧集并检查新集数
    可拖动排序的文件名格式,下载记录与缩略图预览
    在程序内直接更新到最新版本
    最小化到托盘,图标上显示进度
terms_notice = 请在遵守内容提供方服务条款与著作权的范围内使用。
