; TVer Downloader 简体中文翻译。
; 格式: 在 [界面名] 小节下写 键 = 文字。{name} 是代码填入内容的位置,请不要删除。
; 这些文件在 _internal/lang 里。在那里改的内容会在程序自动更新时被新文件覆盖,
; 想保留就在 exe 旁边建一个 lang 文件夹,把副本放进去。
