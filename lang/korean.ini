codec_tooltip = 받은 영상이 여기서 고른 코덱이 아니면 그 코덱으로 다시 만듭니다.
    이때 소리도 AAC로 함께 다시 만듭니다 — Opus나 Vorbis로 남으면
    편집 도구에서 오디오 트랙이 아예 잡히지 않기 때문입니다.
    소리 비트레이트는 원본에 맞춰 정해지고, 원본이 이미 AAC면 그대로 둡니다.

    품질은 정해진 값을 씁니다(AVC는 CRF 20, HEVC는 CRF 23, 각각 preset slow).
    다시 만드는 데 시간이 걸리고 화질은 원본보다 조금 나빠지므로,
    특별히 필요하지 않으면 '원본 유지'가 가장 좋습니다.
encoder_label = 코덱 변환 가속 (GPU 인코딩):
encoder_cpu = CPU (기본값, 호환성)
encoder_nvidia = NVIDIA (NVENC)
encoder_tooltip = 다시 만드는 일을 그래픽카드에 맡깁니다. CPU보다 훨씬 빠릅니다.
    대신 같은 품질 지수에서 압축 효율이 조금 떨어져 파일이 커집니다.
    NVIDIA 그래픽카드가 없으면 변환이 실패하므로 CPU로 두십시오.

subs_download = 자막 다운로드 활성화
subs_embed = 자막을 동영상 파일에 병합 (Embed)
subs_format_group = 별도 파일 저장 시 포맷
subs_vtt = VTT (원본)
subs_srt = SRT (변환, 호환성 좋음)

exclude_label = 시리즈 분석 시 제외할 키워드 (쉼표,로 구분):
exclude_placeholder = 예: 予告, ダイジェスト, 解説放送版
embed_thumb_check = 영상 파일에 썸네일 포함 (탐색기·플레이어 미리보기)
embed_thumb_tooltip = yt-dlp에 --embed-thumbnail 옵션을 전달해 표지 그림을 mp4 안에 넣습니다.
    앱 목록의 썸네일과 달리 탐색기와 외부 플레이어에서도 미리보기가 보입니다.
    포함에 실패해도 영상 다운로드 자체는 그대로 완료됩니다.
ignore_ssl_check = SSL 인증서 검증 건너뛰기 (연결 오류 시에만 사용)
ignore_ssl_tooltip = 체크하면 yt-dlp에 --no-check-certificate 옵션을 전달합니다.
    중간자 공격에 노출될 수 있으므로 인증서 오류로 다운로드가 실패할 때만 사용하세요.

cache_size_label = 현재 썸네일 캐시 크기:
cache_calculating = 계산 중...
cache_clear_button = 썸네일 캐시 지우기
cache_confirm_title = 캐시 삭제
cache_confirm_body = 정말로 모든 썸네일 캐시를 삭제하시겠습니까?
cache_done_title = 완료
cache_done_body = 썸네일 캐시 {count}개를 삭제했습니다.
cache_error_title = 오류
cache_error_body = 캐시 삭제 중 오류 발생:
    {error}

connection_title = 연결 수가 너무 많습니다
connection_body = 동시 다운로드 {parallel}개 × 조각 {fragments}개 = 한꺼번에 {total}개 연결입니다.
    연결 안정성 때문에 두 값을 곱한 수는 {maximum}개까지만 됩니다.

    연결이 너무 많으면 TVer이 접속을 막고, 한번 막히면 값을 되돌려도
    한동안 다운로드가 되지 않습니다.

    둘 중 하나를 줄인 뒤 다시 저장해 주세요.
save_failed_title = 설정 저장 실패
save_failed_body = 설정 파일을 저장하지 못했습니다.
    프로그램 폴더에 쓰기 권한이 있는지 확인해 주세요.
    변경한 내용은 이번 실행에만 적용되며 다음 실행 시 사라집니다.

restart_title = 언어 변경
restart_body = 바꾼 언어는 프로그램을 다시 시작해야 화면에 반영됩니다.

    지금 다시 시작하시겠습니까?
restart_yes = 지금 다시 시작
restart_no = 나중에
restart_failed_title = 다시 시작하지 못했습니다
restart_failed_body = 프로그램을 다시 띄우지 못해 그대로 실행을 이어갑니다.

    바꾼 언어는 다음에 프로그램을 켤 때 반영됩니다.

[about]
title = 정보
intro = TVer 콘텐츠를 개인 용도로 다운받는 윈도우 앱입니다.
    일본 지역제한이 있는 서비스이기 때문에 일본 VPN환경이 필수입니다.
features_title = 주요 기능
features = 다국어 지원
    에피소드 · 시리즈 URL 분석과 다중 추가
    주소 끌어다 놓기 · 클립보드 자동 인식 · 단축키
    껐다 켜도 남는 대기열, 동시 다운로드와 조각 병렬 조절
    화질 선택, 코덱 재인코딩(GPU 가속), 자막 병합
    즐겨찾기 시리즈 등록과 신규 회차 확인
    끌어놓기로 정렬하는 파일명 형식, 기록과 썸네일 미리보기
    프로그램 안에서 바로 새 버전으로 업데이트
    트레이로 최소화, 아이콘에 진행 상황 표시
terms_notice = 콘텐츠 제공자의 약관과 저작권을 지키는 범위에서 사용해 주세요.
