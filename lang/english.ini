; TVer Downloader English translation.
; Format: [screen name] section, then key = text. {name} placeholders are filled
; in by the code -- keep them as-is. This is also the fallback used for any key
; missing from another language file.
; These files live in _internal/lang. Edits there are replaced when the app updates
; itself, so to keep them, put a copy in a lang folder next to the exe instead.
