[about]
title = About
intro = TVer Downloader is a Windows app for downloading TVer content for personal use.
    TVer has Japan-only regional restrictions, so a Japan VPN is required.
features_title = Key Features
features = Multi-language support
    Episode/series URL analysis with bulk add
    Drag-and-drop URLs, clipboard auto-detect, keyboard shortcuts
    Queue that survives restarts, adjustable concurrency and fragments
    Quality selection, codec re-encoding (GPU-accelerated), subtitle muxing
    Favorite series registration with new-episode checks
    Custom filename format, download history with thumbnails
    Update to the latest version right from inside the app
    Minimize to tray, progress shown on the icon
