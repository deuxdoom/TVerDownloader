language_label = Language:
language_system = Auto-detect (system language)
language_tooltip = Shows every part of the app in this language.
    "Auto-detect" follows your Windows display language, falling back to English
    for any language that is not supported.
    Changing this takes effect after you restart the app.
    Translation files live in the lang folder inside _internal, so you can edit them.
folder_label = Download folder:
browse = Browse...
folder_dialog_title = Select download folder
parallel_label = Maximum concurrent downloads:
fragments_label = Fragments to download in parallel per video:
fragments_tooltip = TVer videos are split into hundreds of small fragments.
    Fetching them one at a time leaves your connection underused and is slow.
    Raising this downloads several fragments at once, which is that much faster.

    This multiplies with the concurrent downloads setting above -- raising both
    too far opens so many connections that TVer may block you.
    Set it to 1 to turn this off.
close_label = When the close button (X) is clicked:
close_tray = Minimize to tray
close_exit = Quit the app
clipboard_label = Clipboard:
clipboard_check = Fill the input box automatically when a TVer URL is copied
clipboard_tooltip = When you copy a TVer URL, it is placed in the input box above.
    Downloads do not start on their own, and an input box with text in it is left alone.
    Clipboard contents that are not TVer URLs are never sent anywhere.
    When off, the clipboard is not watched at all.
favorites_label = Favorites:
fav_autocheck_check = Check for new episodes at startup
fav_autocheck_tooltip = Shortly after startup, every series in your favorites is checked.
    TVer is restricted to Japan, so a check that runs before your VPN is up fails for all of them.
    If you have the app start with Windows, leaving this off is the better choice.
    Even when off, "Refresh All" on the Favorites tab checks whenever you want.
update_label = Updates:
auto_update_check = Check for a new version at startup
auto_update_tooltip = Checks for a new version after startup and tells you if one exists.
    You decide then whether to install it; nothing is downloaded on its own.
    "Update Now" fetches the new version and swaps it in place.
    Your settings, history, favorites and the bin folder are left untouched.
    When off, no check is made at all.

