embed_thumb_tooltip = Passes --embed-thumbnail to yt-dlp to store the cover image inside the mp4.
    Unlike the thumbnail in this app's list, it also shows in Explorer and external players.
    If embedding fails, the video download itself still completes.
ignore_ssl_check = Skip SSL certificate verification (use only on connection errors)
ignore_ssl_tooltip = When checked, passes --no-check-certificate to yt-dlp.
    This exposes you to man-in-the-middle attacks, so use it only when certificate errors block a download.

