codec_label = Preferred codec (re-encoding):
codec_original = Keep original (no re-encoding, default)
codec_avc = AVC/H.264 (best compatibility)
codec_hevc = HEVC/H.265 (high efficiency)
codec_tooltip = If a downloaded video is not in the codec chosen here, it is re-encoded to it.
    The audio is re-encoded to AAC at the same time -- left as Opus or Vorbis,
    the audio track is not picked up by editing tools at all.
    Audio bitrate follows the source, and audio already in AAC is copied as-is.

    Quality uses fixed values (CRF 20 for AVC, CRF 23 for HEVC, both preset slow).
    Re-encoding takes time and comes out slightly worse than the source,
    so "Keep original" is best unless you specifically need otherwise.
encoder_label = Codec conversion acceleration (GPU encoding):
encoder_cpu = CPU (default, compatibility)
encoder_nvidia = NVIDIA (NVENC)
encoder_tooltip = Hands re-encoding to your graphics card. Much faster than the CPU.
    In exchange, compression efficiency at the same quality level drops a little, so files grow.
    Without an NVIDIA card the conversion fails, so leave this on CPU.

