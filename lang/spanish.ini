language_label = Idioma:
language_system = Detección automática (idioma del sistema)
language_tooltip = Muestra todos los textos de la aplicación en este idioma.
    "Detección automática" sigue el idioma de Windows y recurre al inglés
    para cualquier idioma que no sea compatible.
    El cambio se aplica después de reiniciar la aplicación.
    Los archivos de traducción están en la carpeta lang dentro de _internal, así que puedes editarlos.
folder_label = Carpeta de descargas:
browse = Examinar...
folder_dialog_title = Elegir carpeta de descargas
parallel_label = Máximo de descargas simultáneas:
fragments_label = Fragmentos a descargar en paralelo por vídeo:
fragments_tooltip = Los vídeos de TVer se dividen en cientos de fragmentos pequeños.
    Bajarlos de uno en uno desaprovecha la conexión y resulta lento.
    Subir este valor descarga varios fragmentos a la vez, y por eso va más rápido.

    Se multiplica con el ajuste de descargas simultáneas de arriba: si subes ambos
    demasiado, se abren tantas conexiones que TVer puede bloquearte.
    Ponlo en 1 para desactivarlo.
close_label = Al pulsar el botón de cerrar (X):
close_tray = Minimizar a la bandeja
close_exit = Salir de la aplicación
clipboard_label = Portapapeles:
clipboard_check = Rellenar el cuadro de entrada al copiar una URL de TVer
clipboard_tooltip = Cuando copias una URL de TVer, se coloca en el cuadro de entrada de arriba.
    Las descargas no empiezan solas, y si el cuadro ya tiene texto no se toca.
    El contenido del portapapeles que no sea una URL de TVer nunca se envía a ninguna parte.
    Cuando está desactivado, el portapapeles no se vigila en absoluto.
favorites_label = Favoritos:
fav_autocheck_check = Buscar episodios nuevos al iniciar
fav_autocheck_tooltip = Poco después de iniciar se revisan todas las series de tus favoritos.
    TVer está restringido a Japón, así que una comprobación anterior a la VPN falla en todas.
    Si tienes la aplicación configurada para iniciarse con Windows, es mejor dejarlo desactivado.
    Aun desactivado, "Actualizar todo" en la pestaña Favoritos comprueba cuando quieras.
update_label = Actualizaciones:
auto_update_check = Buscar una versión nueva al iniciar
auto_update_tooltip = Comprueba si hay una versión nueva al iniciar y te avisa si la hay.
    Tú decides entonces si instalarla; no se descarga nada por su cuenta.
    "Actualizar ahora" obtiene la versión nueva y la sustituye en el sitio.
    Tus ajustes, historial, favoritos y la carpeta bin no se tocan.
    Cuando está desactivado, no se hace ninguna comprobación.

shortcut_guide = Pulsa en un cuadro y presiona la tecla que quieras. Dejarlo vacío desactiva ese atajo.
shortcut_conflict_header = Estas acciones comparten una combinación. Así, al pulsarla no se ejecuta ninguna.
shortcut_note = Las combinaciones sin Ctrl ni Alt no se activan mientras escribes texto.
shortcut_reset = Restaurar los valores predeterminados
shortcut_conflict_title = Conflicto de atajos
shortcut_conflict_body = Dos acciones comparten la misma combinación.
    Resuelve el solapamiento y guarda de nuevo.

filename_guide = Elige las partes del nombre de archivo y su orden (arrastra los elementos para reordenar):
part_series = Serie
part_upload_date = Fecha de emisión
part_episode_number = N.º de episodio
part_episode = Título
part_id = ID único
filename_preview_label = Vista previa del nombre:
filename_preview_empty = (no hay nada seleccionado)

quality_label = Calidad de descarga:
quality_best = La mejor calidad (predeterminado)
quality_1080p = 1080p
quality_720p = 720p
codec_label = Códec preferido (recodificación):
codec_original = Mantener el original (sin recodificar, predeterminado)
codec_avc = AVC/H.264 (mejor compatibilidad)
codec_hevc = HEVC/H.265 (más eficiente)
codec_tooltip = Si un vídeo descargado no está en el códec elegido aquí, se recodifica a él.
    El audio se recodifica a AAC al mismo tiempo: si se deja en Opus o Vorbis,
    las herramientas de edición no detectan la pista de audio en absoluto.
    La tasa de bits del audio sigue a la del origen, y el audio que ya es AAC se copia tal cual.

    La calidad usa valores fijos (CRF 20 para AVC, CRF 23 para HEVC, ambos con preset slow).
    Recodificar lleva tiempo y el resultado sale algo peor que el origen,
    así que "Mantener el original" es lo mejor salvo que necesites otra cosa.
encoder_label = Aceleración de conversión de códec (codificación por GPU):
encoder_cpu = CPU (predeterminado, compatibilidad)
encoder_nvidia = NVIDIA (NVENC)
encoder_tooltip = Deja la recodificación en manos de la tarjeta gráfica. Mucho más rápido que la CPU.
    A cambio, la eficiencia de compresión al mismo nivel de calidad baja un poco y los archivos crecen.
    Sin una tarjeta NVIDIA la conversión falla, así que déjalo en CPU.

subs_download = Activar la descarga de subtítulos
subs_embed = Integrar los subtítulos en el archivo de vídeo (embed)
subs_format_group = Formato al guardar como archivo aparte
subs_vtt = VTT (original)
subs_srt = SRT (convertido, mejor compatibilidad)

exclude_label = Palabras que excluir al analizar una serie (separadas por comas):
exclude_placeholder = p. ej. 予告, ダイジェスト, 解説放送版
embed_thumb_check = Incrustar la miniatura en el archivo de vídeo (vistas previas del Explorador y de reproductores)
embed_thumb_tooltip = Pasa --embed-thumbnail a yt-dlp para guardar la carátula dentro del mp4.
    A diferencia de la miniatura de la lista de esta aplicación, también se ve en el Explorador y en reproductores externos.
    Si la incrustación falla, la descarga del vídeo se completa igualmente.
ignore_ssl_check = Omitir la verificación del certificado SSL (úsalo solo si hay errores de conexión)
ignore_ssl_tooltip = Al marcarlo, se pasa --no-check-certificate a yt-dlp.
    Esto te expone a ataques de intermediario, así que úsalo solo cuando un error de certificado impida la descarga.

cache_size_label = Tamaño actual de la caché de miniaturas:
cache_calculating = Calculando...
cache_clear_button = Vaciar la caché de miniaturas
cache_confirm_title = Vaciar la caché
cache_confirm_body = ¿Eliminar todas las miniaturas de la caché?
cache_done_title = Completado
cache_done_body = Se eliminaron {count} miniaturas de la caché.
cache_error_title = Error
cache_error_body = Error al vaciar la caché:
    {error}

connection_title = Demasiadas conexiones
connection_body = {parallel} descargas simultáneas x {fragments} fragmentos = {total} conexiones a la vez.
    Por estabilidad de la conexión, el producto de los dos valores no puede pasar de {maximum}.

    Demasiadas conexiones hacen que TVer te bloquee, y una vez bloqueado las descargas
    siguen sin funcionar un tiempo aunque bajes los valores de nuevo.

    Reduce uno de los dos y guarda otra vez.
save_failed_title = No se pudieron guardar los ajustes
save_failed_body = No se pudo escribir el archivo de ajustes.
    Comprueba que tienes permiso de escritura en la carpeta de la aplicación.
    Los cambios valen solo para esta sesión y se perderán la próxima vez.

restart_title = Idioma cambiado
restart_body = El idioma nuevo solo aparece después de reiniciar la aplicación.

    ¿Reiniciar ahora?
restart_yes = Reiniciar ahora
restart_no = Más tarde
restart_failed_title = No se pudo reiniciar
restart_failed_body = No se pudo relanzar la aplicación, así que sigue funcionando tal cual.

    El idioma nuevo se aplicará la próxima vez que inicies la aplicación.

[about]
title = Acerca de
intro = TVer Downloader es una aplicación de Windows para descargar contenido de TVer para uso personal.
    TVer tiene restricción regional solo para Japón, así que hace falta una VPN japonesa.
features_title = Funciones principales
features = Compatible con varios idiomas
    Análisis de URL de episodio y serie con adición múltiple
    Arrastrar y soltar URL, detección del portapapeles, atajos de teclado
    Cola que sobrevive a los reinicios; descargas y fragmentos ajustables
    Elección de calidad, recodificación de códec (por GPU), subtítulos integrados
    Registro de series favoritas con comprobación de episodios nuevos
    Formato de nombre reordenable e historial con miniaturas
    Actualizar a la última versión desde dentro de la aplicación
    Minimizar a la bandeja, con el progreso mostrado en el icono
terms_notice = Úsalo dentro de los términos de servicio y los derechos de autor del proveedor de contenido.
version = Versión {version}
check_update = Buscar actualizaciones
checking = Comprobando...
youtube = YouTube del autor
contact = Contacto
check_failed_body = No se pudo comprobar si hay una versión nueva.

    Revisa tu conexión a internet e inténtalo de nuevo.
up_to_date = Ya tienes la última versión. (v{version})

