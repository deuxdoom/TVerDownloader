; TVer Downloader 繁體中文翻譯。
; 格式: 在 [介面名] 小節下寫 鍵 = 文字。{name} 是程式填入內容的位置,請不要刪除。
; 這些檔案在 _internal/lang 裡。在那裡改的內容會在程式自動更新時被新檔案覆蓋,
; 想保留就在 exe 旁邊建一個 lang 資料夾,把副本放進去。
