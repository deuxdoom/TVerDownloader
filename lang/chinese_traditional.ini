language_label = 語言:
language_system = 自動偵測(系統語言)
language_tooltip = 用這個語言顯示程式的所有文字。
    「自動偵測」會跟隨 Windows 的顯示語言,
    不支援的語言會顯示為英語。
    修改後需要重新啟動程式才會生效。
    翻譯檔案在 _internal 資料夾裡的 lang 資料夾中,可以自行編輯。
folder_label = 下載資料夾:
browse = 瀏覽...
folder_dialog_title = 選擇下載資料夾
parallel_label = 最大同時下載數:
fragments_label = 單一影片並行下載的片段數:
fragments_tooltip = TVer 的影片被切成數百個小片段。
    一個一個依序取會用不滿頻寬,所以很慢。
    調高這個值會同時取多個片段,速度也就相應提升。

    這個值會和上面的同時下載數相乘 —— 兩邊都調得太高
    會開啟過多連線,TVer 可能會封鎖您。
    設為 1 表示關閉這個功能。
close_label = 點選關閉按鈕(X)時:
close_tray = 最小化到系統匣
close_exit = 結束程式
clipboard_label = 剪貼簿:
clipboard_check = 複製 TVer 網址時自動填入輸入框
clipboard_tooltip = 複製 TVer 網址時,會自動填入上方的輸入框。
    下載不會自動開始,輸入框裡已經有文字時也不會覆蓋。
    不是 TVer 網址的剪貼簿內容絕不會傳送到任何地方。
    關閉時完全不監視剪貼簿。
favorites_label = 收藏:
fav_autocheck_check = 啟動時檢查新集數
fav_autocheck_tooltip = 啟動後不久會檢查收藏裡的所有劇集。
    TVer 有日本地區限制,在 VPN 連上之前檢查會全部失敗。
    如果設定了開機自動啟動,建議保持關閉。
    即使關閉,也可以隨時用收藏分頁的「全部更新」手動檢查。
update_label = 更新:
auto_update_check = 啟動時檢查新版本
auto_update_tooltip = 啟動後會檢查是否有新版本,有的話會通知您。
    要不要安裝由您當時決定,不會自動下載。
    點選「立即更新」會取得新版本並當場替換。
    您的設定、紀錄、收藏和 bin 資料夾都不會被更動。
    關閉時完全不做檢查。

shortcut_guide = 點選輸入框後按下想用的按鍵。留空表示停用該快速鍵。
