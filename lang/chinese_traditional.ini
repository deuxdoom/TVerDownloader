quality_label = 下載畫質:
quality_best = 最高畫質(預設)
quality_1080p = 1080p
quality_720p = 720p
codec_label = 偏好編碼(重新編碼):
codec_original = 保留原始(不重新編碼,預設)
codec_avc = AVC/H.264(相容性最好)
codec_hevc = HEVC/H.265(效率更高)
codec_tooltip = 下載的影片如果不是這裡選的編碼,就會重新編碼成它。
    音訊也會同時重新編碼成 AAC —— 如果保留 Opus 或 Vorbis,
    剪輯軟體會完全辨識不到音軌。
    音訊位元率跟隨來源檔案,本來就是 AAC 的會原樣複製。

    品質使用固定值(AVC 為 CRF 20,HEVC 為 CRF 23,都是 preset slow)。
    重新編碼需要時間,畫質也會比來源檔案略差,
    所以除非確有需要,「保留原始」是最好的選擇。
encoder_label = 編碼轉換加速(GPU 編碼):
encoder_cpu = CPU(預設,相容性)
encoder_nvidia = NVIDIA(NVENC)
encoder_tooltip = 把重新編碼交給顯示卡處理。比 CPU 快得多。
    代價是相同品質等級下壓縮效率略低,檔案會變大。
    沒有 NVIDIA 顯示卡時轉換會失敗,所以請保持 CPU。

subs_download = 啟用字幕下載
subs_embed = 把字幕合併進影片檔案(嵌入)
subs_format_group = 單獨儲存時的格式
subs_vtt = VTT(原始)
subs_srt = SRT(轉換,相容性更好)

exclude_label = 解析劇集時要排除的關鍵字(用逗號分隔):
exclude_placeholder = 例:予告, ダイジェスト, 解説放送版
embed_thumb_check = 在影片檔案中嵌入縮圖(檔案總管/播放器預覽)
embed_thumb_tooltip = 向 yt-dlp 傳遞 --embed-thumbnail,把封面圖存進 mp4 裡。
    和本程式清單中的縮圖不同,檔案總管和外部播放器裡也能看到。
    即使嵌入失敗,影片下載本身仍會正常完成。
ignore_ssl_check = 略過 SSL 憑證驗證(僅在連線出錯時使用)
ignore_ssl_tooltip = 勾選後會向 yt-dlp 傳遞 --no-check-certificate。
    這會讓您暴露在中間人攻擊下,所以只在憑證錯誤導致下載失敗時使用。

