[about]
title = 關於
intro = TVer Downloader 是一款把 TVer 內容下載到本機供個人使用的 Windows 應用程式。
    TVer 有僅限日本的地區限制,因此必須使用日本的 VPN。
features_title = 主要功能
features = 多語言支援
    單集/劇集網址解析與批次新增
    拖放網址、剪貼簿自動辨識、快速鍵
    重新啟動後仍保留的佇列,可調的同時下載數與片段並行數
    畫質選擇、編碼重新編碼(GPU 加速)、字幕合併
    收藏劇集並檢查新集數
    可拖曳排序的檔名格式,下載紀錄與縮圖預覽
    在程式內直接更新到最新版本
    最小化到系統匣,圖示上顯示進度
terms_notice = 請在遵守內容提供方服務條款與著作權的範圍內使用。
